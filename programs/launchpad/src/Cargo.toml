[package]
name = "custom-launchpad"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "lib"]
name = "custom_launchpad"
[features]
default = []
experimental-receipts = []
experimental-classic = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.31.1", features = ["token", "associated_token", "metadata"] }
launch-core = { path = "../../crates/launch-core" }
orao-solana-vrf = { version = "=0.6.0", default-features = false, features = ["cpi"] }

[dev-dependencies]
solana-program-test = "=2.2.7"
solana-sdk = "=2.2.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
base64 = "0.22"
